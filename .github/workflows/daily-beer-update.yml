name: Daily Beer Update

on:
  schedule:
    # Runs daily at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  update-beer-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run getallbeer.py
        run: |
          python getallbeer.py
      
      - name: Generate HTML for upcoming beer launches
        run: |
          python generate_html_new_beer.py
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/ docs/ || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ docs/
          git commit -m "Update beer data and HTML - $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push

